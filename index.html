<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Watermark Editor</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <button id="btn-toggle-left" class="icon-btn mobile-panel-toggle" title="เครื่องมือ / Layers">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <span class="brand-icon">💧</span>
      <span class="brand-name">Watermark Editor</span>
    </div>
    <div class="topbar-center">
      <button id="btn-upload" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3l5 5h-3v6h-4V8H7l5-5zM5 19h14v2H5z"/></svg>
        นำเข้าไฟล์
      </button>
      <input type="file" id="file-input" multiple hidden accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp,application/pdf,.pdf">
      <span id="doc-name" class="doc-name"></span>
    </div>
    <div class="topbar-actions">
      <button id="btn-toggle-right" class="icon-btn mobile-panel-toggle" title="คุณสมบัติ / Properties">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 5h12v2H3V5zm0 6h18v2H3v-2zm0 6h12v2H3v-2zm14-13l4 4-4 4v-3h-4V9h4V6z" transform="rotate(90 12 12)"/></svg>
      </button>
      <button id="btn-fullscreen" class="btn btn-ghost" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm16 0v6h-6v-2h4v-4h2z"/></svg>
      </button>
      <button id="btn-export" class="btn btn-primary" disabled>ส่งออก / Export</button>
    </div>
  </header>

  <div id="main-body">
    <div class="panel-backdrop" id="panel-backdrop"></div>

    <aside id="left-tools">
      <div class="tools-section">
        <button id="tool-add-text" class="tool-btn" disabled title="เพิ่มลายน้ำข้อความ">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
          <span>ข้อความ</span>
        </button>
        <button id="tool-add-pattern" class="tool-btn" disabled title="เพิ่มลายน้ำแบบ Pattern">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
          <span>Pattern</span>
        </button>
      </div>
      <div class="tools-divider"></div>
      <div class="tools-section-title">Layers <span id="layers-count"></span></div>
      <div id="layers-panel" class="layers-panel">
        <div class="layers-empty">ยังไม่มีลายน้ำ — กด "ข้อความ" หรือ "Pattern" เพื่อเพิ่ม</div>
      </div>
    </aside>

    <main id="center-preview">
      <button id="btn-exit-fullscreen" class="btn-exit-fullscreen" title="ออกจากโหมดเต็มจอ (Esc)" style="display:none">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 3H3v6h2V5h4V3zm12 0h-6v2h4v4h2V3zM5 15H3v6h6v-2H5v-4zm14 4h-4v2h6v-6h-2v4z"/></svg>
        <span>ออกจากเต็มจอ</span>
      </button>
      <div id="preview-toolbar">
        <div class="pt-group">
          <button id="btn-zoom-out" class="icon-btn" title="Zoom out (-)">−</button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-in" class="icon-btn" title="Zoom in (+)">+</button>
        </div>
        <div class="pt-group">
          <button id="btn-fit-width" class="btn btn-sm">Fit Width</button>
          <button id="btn-fit-page" class="btn btn-sm">Fit Page</button>
        </div>
        <div class="pt-group" id="page-indicator-group" style="display:none">
          <button id="btn-prev-page" class="icon-btn" title="Previous page">‹</button>
          <span id="page-indicator">1 / 1</span>
          <button id="btn-next-page" class="icon-btn" title="Next page">›</button>
        </div>
      </div>

      <div id="canvas-wrap">
        <div id="empty-state">
          <div class="empty-icon">🖼️</div>
          <div class="empty-title">ลากไฟล์มาวางที่นี่ หรือกดปุ่ม "นำเข้าไฟล์"</div>
          <div class="empty-sub">รองรับ JPG, JPEG, PNG, WEBP และ PDF</div>
        </div>
        <canvas id="fabric-canvas"></canvas>
      </div>

      <div id="page-thumb-strip" class="page-thumb-strip" style="display:none"></div>
    </main>

    <aside id="right-props">
      <div id="properties-panel">
        <div class="props-empty">เลือกลายน้ำเพื่อแก้ไขคุณสมบัติ</div>
      </div>
    </aside>

  </div>

  <footer id="bottom-bar">
    <div class="bb-group">
      <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)" disabled>↶</button>
      <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Y)" disabled>↷</button>
      <button id="btn-reset" class="btn btn-ghost btn-sm" title="Reset ลายน้ำทั้งหมด" disabled>Reset</button>
    </div>
    <div class="bb-group" id="bb-readout">
      <span id="readout-xy">X: — Y: —</span>
      <span id="readout-size">ขนาด: —</span>
    </div>
    <div class="bb-group">
      <button id="btn-duplicate" class="btn btn-ghost btn-sm" disabled>Duplicate</button>
      <button id="btn-export-2" class="btn btn-primary" disabled>ดาวน์โหลด</button>
    </div>
  </footer>

</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="libs/pdf.min.js"></script>
<script src="libs/pdf-lib.min.js"></script>
<script src="libs/fontkit.umd.min.js"></script>
<script src="libs/fabric.min.js"></script>

<script src="js/data-worker.js"></script>
<script src="js/data-fonts.js"></script>

<script src="js/01-utils.js"></script>
<script src="js/02-fonts.js"></script>
<script src="js/03-state.js"></script>
<script src="js/04-pdf-engine.js"></script>
<script src="js/05-document-import.js"></script>
<script src="js/06-canvas-editor.js"></script>
<script src="js/07-panels.js"></script>
<script src="js/08-page-navigator.js"></script>
<script src="js/09-export.js"></script>
<script src="js/10-toolbar.js"></script>
<script src="js/11-app.js"></script>
</body>
</html>
